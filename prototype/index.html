<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Riki Scene - Preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="mark" aria-hidden="true">R</span>
          <div>
            <strong>riki.scene</strong>
            <small>comparison video studio</small>
          </div>
        </div>
        <div class="project-status">
          <span class="status-dot"></span>
          <span>Preview tu dong</span>
        </div>
        <button class="primary-action" id="renderButton" type="button">Render MP4</button>
      </header>

      <main class="workspace">
        <section class="preview-rail" aria-label="Khu vuc xem truoc video">
          <div class="preview-toolbar">
            <button class="icon-button" id="prevScene" type="button" title="Canh truoc">‹</button>
            <strong><span id="sceneNumber">1</span>/<span id="sceneTotal">1</span></strong>
            <button class="icon-button" id="nextScene" type="button" title="Canh tiep">›</button>
          </div>

          <article class="phone-stage" aria-live="polite">
            <div class="video-card">
              <div class="comparison-head">
                <h2 id="previewLeftTerm">Khach quan</h2>
                <h2 id="previewRightTerm">Chu quan</h2>
              </div>
              <div class="image-row">
                <div class="image-slot">
                  <img id="leftPreviewImage" alt="Anh so sanh ben trai" />
                </div>
                <div class="image-slot">
                  <img id="rightPreviewImage" alt="Anh so sanh ben phai" />
                </div>
              </div>
              <p class="scene-line" id="previewLine">Day la khach quan.</p>
              <div class="presenter" id="presenter" aria-hidden="true">
                <div class="bubble" id="poseBubble">chi trai</div>
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm arm-left"></div>
                <div class="arm arm-right"></div>
                <div class="leg leg-left"></div>
                <div class="leg leg-right"></div>
              </div>
            </div>
          </article>

          <div class="transport">
            <button class="secondary-action" id="playButton" type="button">Phat thu</button>
            <span id="timeReadout">00:00</span>
          </div>
        </section>

        <section class="editor-panel" aria-label="Bang bien tap noi dung">
          <div class="tabs" role="tablist" aria-label="Che do bien tap">
            <button class="tab active" data-tab="content" type="button">Noi dung</button>
            <button class="tab" data-tab="pose" type="button">Pose & am thanh</button>
          </div>

          <div class="tab-panel active" id="contentPanel">
            <div class="section-title">
              <span></span>
              <h1>Thong tin hien thi</h1>
              <span></span>
            </div>

            <div class="field-grid">
              <label>
                Tu khoa trai
                <input id="leftTerm" value="Khach quan" />
              </label>
              <label class="color-field">
                Mau
                <input id="leftColor" type="color" value="#b92c1e" />
              </label>
              <label>
                Tu khoa phai
                <input id="rightTerm" value="Chu quan" />
              </label>
              <label class="color-field">
                Mau
                <input id="rightColor" type="color" value="#6f9f42" />
              </label>
            </div>

            <div class="asset-grid">
              <article class="asset-card">
                <div class="asset-preview"><img id="leftEditorImage" alt="Anh ben trai trong editor" /></div>
                <div class="control-row">
                  <label class="file-button">Thay anh<input id="leftUpload" type="file" accept="image/*" /></label>
                  <label>Zoom <input id="leftZoom" type="range" min="90" max="130" value="100" /></label>
                  <button class="ghost-action" id="resetLeft" type="button">Reset</button>
                </div>
              </article>

              <article class="asset-card">
                <div class="asset-preview"><img id="rightEditorImage" alt="Anh ben phai trong editor" /></div>
                <div class="control-row">
                  <label class="file-button">Thay anh<input id="rightUpload" type="file" accept="image/*" /></label>
                  <label>Zoom <input id="rightZoom" type="range" min="90" max="130" value="104" /></label>
                  <button class="ghost-action" id="resetRight" type="button">Reset</button>
                </div>
              </article>
            </div>

            <label class="wide-field">
              Cau nhan manh trong preview
              <textarea id="keyStatement" rows="3">Khach quan nhin vao su viec nhu no dang dien ra. Chu quan them cam xuc, kinh nghiem va goc nhin rieng cua nguoi noi.</textarea>
            </label>
          </div>

          <div class="tab-panel" id="posePanel">
            <div class="section-title">
              <span></span>
              <h1>Dien xuat tung phan doan</h1>
              <span></span>
            </div>

            <div class="voice-strip">
              <label>
                Giong doc
                <select id="voiceSelect">
                  <option>Nu mien Bac - ro rang</option>
                  <option>Nam mien Nam - cham rai</option>
                  <option>Upload voice rieng</option>
                  <option>Ket noi API TTS</option>
                </select>
              </label>
              <label>
                Nhac nen
                <select>
                  <option>Nhe, tri thuc</option>
                  <option>Khong nhac nen</option>
                  <option>Song dong</option>
                </select>
              </label>
            </div>

            <div class="pose-list" id="poseList"></div>
          </div>
        </section>

        <aside class="script-panel" aria-label="Kich ban thuyet minh">
          <div class="script-heading">
            <span>Kich ban</span>
            <strong>Moi dong la mot nhip doc</strong>
          </div>
          <textarea id="scriptInput" spellcheck="false">Day la khach quan.
Day la chu quan.
Su khac nhau la gi?
Khach quan la goc nhin nhin nhan su viec dung nhu ban chat thuc te dang dien ra.
Chu quan la goc nhin xuat phat tu y muon, cam xuc, kinh nghiem va quan diem rieng.
Day la tri tue nhan tao.
Day la tri tue con nguoi.
Tri tue nhan tao xu ly du lieu voi toc do nhanh va on dinh.
Tri tue con nguoi co kha nang thau cam, phan bien va sang tao.</textarea>
          <div class="script-meta">
            <span><strong id="lineCount">0</strong> dong</span>
            <span><strong id="durationCount">0</strong>s uoc tinh</span>
          </div>
        </aside>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
