<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Riki Scene - Video Builder</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span>R</span><strong>riki.scene</strong></div>
      <div class="status" id="saveStatus">Chua luu</div>
      <div class="actions">
        <button id="saveProject" type="button">Luu JSON</button>
        <label>Mo JSON<input id="openProject" type="file" accept=".json,application/json" /></label>
        <button class="hot" id="exportRender" type="button">Xuat goi render</button>
      </div>
    </header>

    <main class="layout">
      <section class="preview-column">
        <div class="stage-tools">
          <button id="prevScene" type="button" title="Canh truoc">‹</button>
          <strong><span id="sceneNumber">1</span>/<span id="sceneTotal">1</span></strong>
          <button id="nextScene" type="button" title="Canh tiep">›</button>
        </div>

        <article class="phone">
          <div class="video-card" id="videoCard">
            <div class="terms">
              <h2 id="leftTitle">Khach quan</h2>
              <h2 id="rightTitle">Chu quan</h2>
            </div>
            <div class="visuals">
              <img id="leftImagePreview" alt="Anh so sanh trai" />
              <img id="rightImagePreview" alt="Anh so sanh phai" />
            </div>
            <p id="sceneText">Day la khach quan.</p>
            <div class="actor" id="actor" aria-hidden="true">
              <span id="poseName">chi trai</span>
              <i class="head"></i><i class="body"></i><i class="arm left"></i><i class="arm right"></i><i class="leg one"></i><i class="leg two"></i>
            </div>
          </div>
        </article>

        <div class="player">
          <button class="blue" id="playButton" type="button">Phat thu</button>
          <time id="timeReadout">00:00</time>
        </div>

        <div class="render-box">
          <label>Khung video
            <select id="formatSelect">
              <option value="1080x1920">Doc 9:16 - 1080x1920</option>
              <option value="1920x1080">Ngang 16:9 - 1920x1080</option>
              <option value="1080x1080">Vuong 1:1 - 1080x1080</option>
            </select>
          </label>
          <label>FPS
            <select id="fpsSelect"><option>30</option><option>24</option><option>60</option></select>
          </label>
          <label>Chuyen canh
            <select id="transitionSelect"><option value="cut">Cat nhanh</option><option value="soft">Mo mem</option><option value="slide">Truot anh</option></select>
          </label>
        </div>
      </section>

      <section class="editor">
        <nav class="tabs">
          <button class="tab active" data-panel="contentPanel" type="button">Noi dung</button>
          <button class="tab" data-panel="scenePanel" type="button">Scene & timing</button>
        </nav>

        <div class="panel active" id="contentPanel">
          <h1>Du lieu hinh anh</h1>
          <div class="term-grid">
            <label>Tu trai<input id="leftTerm" value="Khach quan" /></label>
            <label>Mau<input id="leftColor" type="color" value="#b92c1e" /></label>
            <label>Tu phai<input id="rightTerm" value="Chu quan" /></label>
            <label>Mau<input id="rightColor" type="color" value="#6f9f42" /></label>
          </div>

          <div class="asset-grid">
            <article>
              <div class="asset"><img id="leftImageEditor" alt="Anh trai" /></div>
              <div class="asset-actions">
                <label class="file">Thay anh<input id="leftUpload" type="file" accept="image/*" /></label>
                <label>Zoom<input id="leftZoom" type="range" min="85" max="135" value="100" /></label>
                <button id="resetLeft" type="button">Reset</button>
              </div>
            </article>
            <article>
              <div class="asset"><img id="rightImageEditor" alt="Anh phai" /></div>
              <div class="asset-actions">
                <label class="file">Thay anh<input id="rightUpload" type="file" accept="image/*" /></label>
                <label>Zoom<input id="rightZoom" type="range" min="85" max="135" value="104" /></label>
                <button id="resetRight" type="button">Reset</button>
              </div>
            </article>
          </div>

          <div class="image-actions">
            <button class="blue" id="swapImages" type="button">Doi vi tri anh</button>
            <button id="clearImages" type="button">Xoa anh</button>
          </div>
        </div>

        <div class="panel" id="scenePanel">
          <h1>Scene render</h1>
          <div class="scene-list" id="sceneList"></div>
        </div>
      </section>

      <aside class="script">
        <div>
          <span>Kich ban</span>
          <strong>Moi dong tao mot scene</strong>
        </div>
        <textarea id="scriptInput" spellcheck="false">Day la khach quan.
Day la chu quan.
Su khac nhau la gi?
Khach quan la goc nhin nhin nhan su viec dung nhu ban chat thuc te dang dien ra.
Chu quan la goc nhin xuat phat tu y muon, cam xuc, kinh nghiem va quan diem rieng.
Day la tri tue nhan tao.
Day la tri tue con nguoi.</textarea>
        <div class="meta">
          <span><b id="lineCount">0</b> scene</span>
          <span><b id="durationCount">0</b>s</span>
        </div>
        <div class="timeline" id="timeline"></div>
      </aside>
    </main>

    <div class="toast" id="toast"></div>
    <script src="./app.js"></script>
  </body>
</html>
